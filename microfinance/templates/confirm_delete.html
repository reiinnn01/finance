{% extends "base.html" %}
{% block title %}Delete - Microfinance{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Delete this record?</h1></div></div>
<div class="card confirm">
  <p><strong>{{ object }}</strong> will be removed. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn danger" type="submit">Delete</button>
      <a class="btn outline" href="{{ request.META.HTTP_REFERER|default:'/' }}">Keep it</a>
    </div>
  </form>
</div>
{% endblock %}
